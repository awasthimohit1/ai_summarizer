name: Daily AI Blog Summarizer

on:
  schedule:
    # Runs at 02:30 UTC every day (08:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # Gives you a "Run workflow" button in GitHub to test manually

jobs:
  run-summarizer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run summarizer script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and push history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f history.json ]; then
            git add history.json
            git commit -m "chore: update history.json [skip ci]" && git push || echo "No changes to commit"
          else
            echo "history.json not found, skipping commit."
          fi
